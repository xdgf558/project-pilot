# CI(P0-05,P0-08 加漂移检查,P0-04 加 Release)
#
# 跑八项检查,分四组:
#
#   构建与测试   Debug 与 Release 各构建一次、各跑一遍测试,都要求零警告
#   模块边界     PilotCore 纯净性、shell 拼接、依赖方向、测试替身不入产品
#   执行器规则   AGENTS.md / CLAUDE.md 与权威源无漂移
#   各自的测试   上面两个检查脚本本身也有测试 —— 检查器带 bug 通过过手工冒烟
#
# 「依赖方向有**自动**检查」是 Phase 0 退出闸门的直接要求。在本工作流存在之前
# 只能靠人手动敲脚本,那条闸门并不成立。
#
# Release 不是「再编一遍」。SPM 的 Debug 用 -Onone、Release 用 -O,
# 而 -O 下 assert() 被整个移除、precondition() 保留 —— 只测 Debug
# 等于发布构建从来没被验证过。见 ADR-0006。
#
# ── 版本固定(v0.2 §11 规则 8:不使用 latest 浮动版本)──
#
# runner 用 xcode-27 而不是 macos-latest。
#
# **这个镜像是 GitHub 标注的 preview,承载的是 Xcode 27 beta。** 选它是因为
# 开发机已经换到了 Xcode 27,而 26.6 上的 Swift 6.3.3 与 27 上的 6.4 是
# 两个编译器 —— 本地绿了 CI 未必绿,反过来也一样。
#
# 代价必须说清:
#   镜像标注 preview,GitHub 原话是「some software can be unstable」
#   beta 会轮换。轮换时下面写死的路径会消失,本工作流**硬失败**并列出
#   镜像上实际有哪些 Xcode —— 那是有意的,升级要是主动决定(v0.2 §11 规则 8)
#   preview 标签可能排队
#
# 见 ADR-0013。
#
# 第三方 action 锁到 commit SHA 而不是 @v7 —— tag 是会被移动的,只有 SHA 不会。
# SHA 后面的注释写明对应版本,便于人读。更新由 Dependabot 提 PR,人工决定,
# 见 .github/dependabot.yml。
#
# Xcode 锁到具体路径 + 断言 build 号。找不到该路径时**硬失败**(跑不了已验证
# 版本就不该假装通过);build 号漂移时只**告警不熔断** —— 依据 v0.3「异议 1」:
# 降级要可见,不该是熔断。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 最小权限:CI 只需要读代码。
permissions:
  contents: read

# 同一分支的新推送取消旧运行,避免排队浪费。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    name: 构建与测试
    runs-on: xcode-27
    timeout-minutes: 20

    env:
      # 已验证的工具链。升级时改这两行,并按 v0.3 §4 的流程走:
      # 记录回滚点 → 升级 → 跑契约测试 → 绿则记 ADR,红则查哪条契约破了。
      VERIFIED_XCODE_APP: /Applications/Xcode_27_beta_6.app
      VERIFIED_XCODE_BUILD: 27A5252f

    steps:
      - name: 检出
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 固定工具链并记录版本
        run: |
          if [ ! -d "$VERIFIED_XCODE_APP" ]; then
            echo "::error::找不到已验证的 Xcode:$VERIFIED_XCODE_APP"
            echo "runner 镜像已变更。按 v0.2 §11 规则 8,升级必须是主动决定 ——"
            echo "请先在本地验证新版本,再更新本工作流的 VERIFIED_XCODE_APP。"
            echo "镜像上现有的 Xcode:"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "  (一个都没有)"
            exit 1
          fi
          sudo xcode-select -s "$VERIFIED_XCODE_APP"

          actual_build=$(xcodebuild -version | sed -n 's/^Build version //p')
          if [ "$actual_build" != "$VERIFIED_XCODE_BUILD" ]; then
            echo "::warning::Xcode build 号漂移 —— 期望 $VERIFIED_XCODE_BUILD,实际 $actual_build。不熔断,但请确认契约未破。"
          fi

          # 这份记录就是「已验证版本」的凭据。git 与 gh 的版本给 Phase 2 的
          # 契约测试(P2-10)做基线参考 —— 注意那是 CI 环境的版本,不等于开发机。
          # 把工具链打成 annotation,不用翻 summary 就能在运行列表里看到。
          # beta 轮换时这一行是最快的对照依据。
          echo "::notice::$(xcodebuild -version | tr '\n' ' ')| $(swift --version 2>&1 | grep -oE 'Apple Swift version [0-9.]+ \(swiftlang-[0-9.]+')"
          {
            echo "## 工具链"
            echo '```'
            sw_vers
            echo "---"
            xcodebuild -version
            echo "---"
            swift --version
            echo "---"
            echo "git $(git --version | sed 's/^git version //')"
            echo "gh  $(gh --version | head -1 | sed 's/^gh version //')"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 构建 Debug(警告即错误)
        run: |
          set -o pipefail
          swift build -Xswiftc -warnings-as-errors 2>&1 | tee build-debug.log

      - name: 单元测试 Debug
        run: Scripts/run-tests.sh debug

      # Release 不只是「再编一遍」。SPM 的 Debug 用 -Onone、Release 用 -O,
      # 两者行为真的不同 —— 最要命的是 assert() 在 -O 下被整个移除,
      # 而 precondition() 保留。只测 Debug 意味着发布构建里少掉的那些检查
      # 从来没有被验证过。优化器也会暴露 Debug 下看不见的警告。
      - name: 构建 Release(警告即错误)
        run: |
          set -o pipefail
          swift build -c release -Xswiftc -warnings-as-errors 2>&1 | tee build-release.log

      - name: 单元测试 Release
        run: Scripts/run-tests.sh release

      - name: 模块边界检查
        run: Scripts/check-module-boundaries.sh

      - name: 边界检查器自身的测试
        run: Scripts/test-check-module-boundaries.sh

      - name: 执行器规则漂移检查
        # AGENTS.md 与 CLAUDE.md 是生成物。分开维护的失败方式是静默的 ——
        # 只改了一边,同一个工作包派给 Codex 和派给 Claude 会得到不同行为,
        # 而没有任何东西会报错。这一步让漂移变成硬失败。
        run: Scripts/generate-executor-rules.sh --check

      - name: 规则生成器自身的测试
        run: Scripts/test-generate-executor-rules.sh

      - name: 变异探针自身的测试
        # 探针是用来判断「测试有没有拦住改动」的工具。它自己判断错了,
        # 得到的是一个方向相反的结论 —— 比没有探针更坏。
        run: Scripts/test-mutation-probe.sh

      - name: 上传测试结果与日志
        # P0-05 要求上传测试结果与失败日志。失败时最需要这些,所以用 always()。
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ github.run_id }}
          path: |
            test-results*.xml
            build-*.log
            test-*.log
          retention-days: 14
          if-no-files-found: warn
